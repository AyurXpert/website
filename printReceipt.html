<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Receipt - AyurXpert</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cloudflareinsights.com https://static.cloudflareinsights.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap"/>
  <!-- Page-local styles replacing the Tailwind CDN (removed 1 Oct 2026, same reason as
       printInvoice.html: on the live site the service worker could serve it as a non-script
       response, so receipts printed unstyled). Same class names printReceipt.js uses. -->
  <style>
    :root{--green-deep:#1a4a2e;--text-dark:#1c2b1f;--text-mid:#4a6352;--text-muted:#6a8070;--border:#c8ddd0;--red:#c0392b}
    *{box-sizing:border-box}
    body{margin:0;font-family:'DM Sans',Arial,sans-serif;color:var(--text-dark);background:#fff}
    h1,p{margin:0}
    hr{border:0;border-top:1px solid var(--border)}
    table{border-collapse:collapse}
    img{display:block}
    .bg-white{background:#fff}
    .p-6{padding:24px}.pt-2{padding-top:8px}.py-1{padding-top:4px;padding-bottom:4px}
    .mx-auto{margin-left:auto;margin-right:auto}.my-3{margin:12px 0}.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
    .max-w-md{max-width:28rem}.w-full{width:100%}.h-12{height:48px}
    .relative{position:relative}.absolute{position:absolute}.inset-0{inset:0}.pointer-events-none{pointer-events:none}
    .flex{display:flex}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.items-start{align-items:flex-start}.items-center{align-items:center}
    .border{border:1px solid var(--border)}.border-t{border-top:1px solid var(--border)}
    .text-xs{font-size:12px}.text-sm{font-size:14px}.text-lg{font-size:18px}.text-6xl{font-size:60px}.text-xl{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:var(--green-deep)}
    .font-bold{font-weight:700}.font-semibold{font-weight:600}.italic{font-style:italic}.opacity-20{opacity:.2}
    .text-right{text-align:right}.text-center{text-align:center}
    .text-gray-500{color:var(--text-muted)}.text-gray-600{color:var(--text-mid)}.text-red-600{color:var(--red)}
    .print-btn{background:var(--green-deep);color:#fff;border:0;border-radius:8px;min-height:44px;padding:0 20px;font:600 14px 'DM Sans',sans-serif;cursor:pointer}
  </style>
  <link rel="stylesheet" href="css/print.css"/>
  <link rel="stylesheet" href="css/paper-size.css"/>
</head>

<!-- ax-printing + .ax-print-root (css/print.css): only the receipt prints, never the Print button. -->
<body class="bg-white p-6 ax-printing">

<div class="ax-print-root">
<div id="receipt" class="max-w-md mx-auto border p-6 relative">

  <div id="void-watermark" class="absolute inset-0 flex items-center justify-center pointer-events-none" style="display:none">
    <span class="text-red-600 font-bold text-6xl opacity-20" style="transform:rotate(-25deg)">VOID</span>
  </div>

  <!-- HEADER -->
  <div class="flex justify-between items-start mb-4">
    <div>
      <h1 id="clinicName" class="text-xl font-bold">AyurXpert HMS</h1>
      <p id="clinicAddress" class="text-xs text-gray-500" style="display:none"></p>
      <p id="clinicGstin" class="text-xs text-gray-500" style="display:none"></p>
    </div>
    <img class="h-12" id="clinic-logo" style="display:none;object-fit:contain" />
  </div>

  <hr class="my-3">

  <div id="docTitle" class="text-center text-lg font-bold mb-3">RECEIPT</div>

  <div id="receiptMeta" class="text-sm mb-3"></div>
  <div id="patientInfo" class="text-sm mb-3"></div>

  <table class="w-full text-sm mb-3">
    <tbody id="lineTable"></tbody>
  </table>

  <div class="text-right border-t pt-2 mb-2">
    <div class="text-lg font-bold" id="totalAmount"></div>
  </div>
  <div id="amountWords" class="text-xs text-gray-600 italic mb-3"></div>

  <div id="receivedByLine" class="text-xs text-gray-600 mb-1"></div>
  <div id="voidLine" class="text-xs text-red-600 font-semibold mt-2" style="display:none"></div>

  <div class="mt-6 text-center text-xs text-gray-500" id="notaxNote" style="display:none">
    Interim bill — not a tax invoice
  </div>

</div>
</div><!-- /ax-print-root -->

<div class="text-center mt-4 no-print">
  <button data-onclick="print" class="print-btn">
    Print / Save PDF
  </button>
  <span id="paper-slot" style="margin-left:10px"></span>
</div>

<script type="module" src="js/pages/printReceipt.js"></script>
</body>
</html>
